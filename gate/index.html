<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>기초학력관 · 한국어</title>
<style>
/* 아이스크림 화면(기초학력관·자료실)의 색·간격에 맞춘 시안. 상단 머리글은 실제 사이트 공통 영역을 흉내 낸 자리표시. */
:root{
  --or:#fe5e02;--or-50:#fff4ec;
  --ink:#222;--ink2:#555;--ink3:#999;--line:#e6e6e6;--line2:#d9d9d9;--bg:#f5f5f5;
  --L:#e8664a;--Ls:#fdeee9;--S:#e5a12c;--Ss:#fdf4e2;--R:#3f9e78;--Rs:#e8f5ef;--W:#3478c4;--Ws:#e7f0fa;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fff;color:var(--ink);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;letter-spacing:-.3px}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
.in{width:1280px;margin:0 auto}

/* 사이트 공통 머리글(자리표시) */
.util{display:flex;justify-content:space-between;padding:12px 0 0;font-size:13px;color:var(--ink3)}
.util span+span:before{content:"|";margin:0 9px;color:#ddd}
.util .r{color:var(--ink);font-size:14px}
.util .r em{font-style:normal;color:var(--or)}
.brand{display:flex;align-items:center;height:118px;position:relative}
.logo{font-size:40px;font-weight:900;letter-spacing:-1px;font-family:"Arial Rounded MT Bold","Pretendard",sans-serif}
.gsearch{position:absolute;left:515px;width:252px;height:42px;border:1.5px solid #ffb38a;border-radius:999px;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;color:var(--or)}
.gnb{display:flex;align-items:center;gap:48px;height:76px;border-bottom:1px solid var(--line);font-size:19px;font-weight:500}
.gnb .ham{width:20px;display:flex;flex-direction:column;gap:5px}.gnb .ham i{height:2px;background:var(--ink)}
.gnb .on{color:var(--or)}

/* 페이지 제목 */
.ptitle{display:flex;align-items:baseline;gap:16px;padding:58px 0 14px;border-bottom:1px solid var(--or);font-size:36px;font-weight:500}
.ptitle .off{color:#999}
.ptitle .bar{width:2px;height:16px;background:var(--or);align-self:center}
.ptitle small{margin-left:8px;font-size:16px;color:var(--ink3);font-weight:400}

/* 안내 띠 */
.intro{display:flex;align-items:center;gap:24px;margin-top:28px;background:var(--or-50);border:1px solid #ffe2cf;border-radius:12px;padding:20px 26px}
.intro .ic{flex:none;width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--or)}
.intro p{margin:0;flex:1;font-size:15px;line-height:1.6;color:var(--ink2)}
.intro p b{display:block;font-size:18px;color:var(--ink);font-weight:600;margin-bottom:2px}
.intro p em{font-style:normal;color:var(--or);font-weight:600}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 20px;border-radius:4px;border:1px solid var(--or);background:#fff;color:var(--or);font-size:15px;font-weight:500;white-space:nowrap}
.ibtn.f{background:var(--or);color:#fff}

/* 학년군 큰 탭 · 영역 둥근 탭 · 수준 버튼 */
.bigtabs{display:flex;justify-content:center;gap:8px;margin-top:34px}
.bigtabs button{width:212px;height:52px;border:1px solid var(--or);background:#fff;color:var(--or);font-size:17px;border-radius:2px}
.bigtabs button.on{background:var(--or);color:#fff}
.bigtabs small{font-size:14px;opacity:.8}
.pills{display:flex;justify-content:center;gap:6px;margin-top:16px}
.pills button{height:36px;padding:0 26px;border-radius:999px;border:1px solid #333;background:#fff;font-size:15px}
.pills button.on{background:#222;color:#fff}
.filters{display:flex;align-items:center;gap:4px;margin-top:30px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.filters button{height:32px;min-width:75px;padding:0 14px;border:1px solid #bbb;background:#fff;font-size:14px;color:var(--ink2)}
.filters button.on{background:#666;border-color:#666;color:#fff}
.search{margin-left:auto;display:flex;align-items:center;width:232px;height:40px;border:1px solid var(--line);padding:0 12px 0 16px;color:var(--or)}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:14px;color:var(--ink)}
.search input::placeholder{color:#bbb}
.total{display:flex;align-items:center;padding:30px 16px 18px;font-size:15px;color:var(--ink2)}
.total em{font-style:normal;color:var(--or)}

/* 차시 카드 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:40px 26px;padding:0 0 30px}
.lvhead{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;margin-bottom:-18px}
.lvhead small{font-size:14px;font-weight:400;color:var(--ink3)}
.lvhead:after{content:"";flex:1;height:1px;background:var(--line);margin-left:6px}
.card{display:flex;flex-direction:column}
.th{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--as);cursor:pointer}
.th img.shot{width:100%;height:100%;object-fit:cover;display:block}
.gen{position:absolute;inset:0;padding:12px 14px}
.gen .bar{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--ac)}
.gen .bar i{width:6px;height:6px;border-radius:50%;background:var(--ac)}
.gen .bar:after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--ac) 30%,transparent)}
.gen b{position:absolute;left:14px;top:38px;right:96px;font-size:19px;line-height:1.3;font-weight:800;color:#2b2b2b;letter-spacing:-.6px}
.gen img{position:absolute;right:8px;bottom:-4px;height:96px}
.gen .no{position:absolute;left:14px;bottom:12px;font-size:12px;font-weight:700;color:var(--ac);background:#fff;border-radius:999px;padding:3px 10px}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0);transition:background .2s}
.play span{width:54px;height:54px;border-radius:50%;background:rgba(254,94,2,.92);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:.2s}
.th:hover .play{background:rgba(0,0,0,.18)}.th:hover .play span{opacity:1;transform:none}
.meta1{display:flex;gap:5px;margin-top:12px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;background:#333;color:#fff}
.chip.a{background:var(--as);color:var(--ac);font-weight:600}
.ct{margin-top:8px;font-size:16px;font-weight:500;line-height:1.4;cursor:pointer}
.ct:hover{text-decoration:underline}
.cm{margin-top:3px;font-size:13px;color:var(--ink3)}
.cbtn{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cbtn button{flex:1;height:36px;border-radius:4px;border:1px solid var(--line2);background:#fff;font-size:14px;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:5px}
.cbtn button.go{border-color:var(--or);background:var(--or);color:#fff}
[data-a="듣기"]{--ac:var(--L);--as:var(--Ls)}[data-a="말하기"]{--ac:var(--S);--as:var(--Ss)}[data-a="읽기"]{--ac:var(--R);--as:var(--Rs)}[data-a="쓰기"]{--ac:var(--W);--as:var(--Ws)}
.foot{height:120px;margin-top:60px;background:var(--bg);border-top:1px solid var(--line)}

/* 모달(가운데) */
.dim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:none}
.dim.on{display:block}
.modal{position:fixed;left:50%;top:50%;z-index:31;width:min(1000px,calc(100vw - 48px));max-height:calc(100vh - 64px);background:#fff;border-radius:16px;overflow:hidden;display:none;flex-direction:column;transform:translate(-50%,-50%)}
.modal.on{display:flex;animation:mIn .22s ease-out}
@keyframes mIn{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}
.mHead{position:relative;padding:26px 32px 22px;border-bottom:1px solid var(--line)}
.mHead .chips{display:flex;gap:6px;margin-bottom:10px}
.mHead h2{margin:0;font-size:28px;font-weight:600;letter-spacing:-.8px}
.mHead .id{margin-top:4px;font-size:14px;color:var(--ink3)}
.x{position:absolute;right:20px;top:20px;width:40px;height:40px;border:0;background:none;color:#333}
.mBody{flex:1;overflow:auto;padding:28px 32px;display:grid;grid-template-columns:430px 1fr;gap:34px}
.mBody h4,.dgrid h4{margin:0 0 8px;font-size:14px;color:var(--or);font-weight:600}
.blk{margin-bottom:22px}.blk:last-child{margin-bottom:0}
.goal{font-size:19px;font-weight:600;line-height:1.5}
.std{background:#f8f8f8;border-radius:8px;padding:13px 16px;line-height:1.55;color:var(--ink2)}
.codes{display:flex;flex-wrap:wrap;gap:6px}
.codes span{font-family:ui-monospace,Menlo,monospace;font-size:13px;border:1px solid var(--line2);border-radius:4px;padding:3px 8px;color:var(--ink2)}
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.acts li{display:flex;gap:10px;line-height:1.45;color:var(--ink2)}
.acts li b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--or-50);color:var(--or);font-size:13px;display:flex;align-items:center;justify-content:center}
.mFoot{display:flex;align-items:center;gap:8px;padding:16px 32px;border-top:1px solid var(--line);background:#fafafa}
.mFoot small{margin-right:auto;color:var(--ink3);font-size:13px}
.mFoot .ibtn{height:48px;padding:0 26px;font-size:16px}

/* 진단으로 찾기(모달 안) */
.dgrid{display:grid;grid-template-columns:380px 1fr;gap:28px;padding:26px 32px;overflow:auto}
.drow{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.drow .an,.path .an{font-weight:600;color:var(--ac)}
.lvb{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.lvb button{height:44px;border:1px solid var(--line2);background:#fff;border-radius:4px;font-size:13px;color:var(--ink2);line-height:1.2}
.lvb button small{display:block;font-size:10.5px;color:var(--ink3)}
.lvb button.on{background:var(--ac);border-color:var(--ac);color:#fff}.lvb button.on small{color:#fff}
.path{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.path .an{font-size:15px}.path .an small{display:block;font-weight:400;color:var(--ink3);font-size:12px}
.flow{display:flex;gap:6px;align-items:center}
.step{flex:1;min-height:64px;border:1px solid var(--line2);border-radius:6px;padding:8px 10px;font-size:13px;line-height:1.35;cursor:pointer;background:#fff}
.step.first{border-color:var(--ac);background:var(--as)}
.step .s{display:inline-block;font-size:11px;color:#fff;background:var(--ac);border-radius:3px;padding:1px 6px;margin-bottom:3px}
.flow .ar{color:#bbb}
</style>
</head>
<body>
<div class="in">
  <div class="util"><div><span>아이스크림</span><span>교과서</span><span>AI디지털 교육자료</span><span>연수원</span><span>아이스크림몰</span><span>하이클래스</span><span>띵커벨</span><span>issamGPT</span></div><div class="r"><span>로그아웃</span><span>마이페이지</span><span><em>연수혜택</em></span><span>고객센터</span></div></div>
  <div class="brand"><span class="logo">i-Scream</span><span class="gsearch"><i class="si"></i></span></div>
  <nav class="gnb"><span class="ham"><i></i><i></i><i></i></span><span>교과활동</span><span>평가자료</span><span>창의적 체험활동</span><span>쉬는 시간</span><span>자료실</span><span>쌤블로그</span><span>AI평어</span><span>학교자율시간</span><span class="on">기초학력관</span></nav>

  <div class="ptitle"><span class="off">수학</span><span class="bar"></span><span class="off">영어</span><span class="bar"></span><span>한국어</span><small>다문화 학생 한국어 학습</small></div>

  <div class="intro"><span class="ic" id="introIc"></span><p><b>진단 결과에 맞는 한국어 수업을 바로 열어요</b>한국어능력 초기진단(초1~6)의 성취수준 하나를 한 차시로 만들었어요. 차시를 누르면 수업이 <em>새 창</em>으로 열려요. 전자칠판에서는 F11로 전체 화면을 쓰세요.</p>
    <button class="ibtn f" onclick="openDiag()"><i class="si"></i>진단 결과로 찾기</button><button class="ibtn">초기진단 도구 내려받기</button></div>

  <div class="bigtabs" id="gtabs"></div>
  <div class="pills" id="atabs"></div>
  <div class="filters"><span id="ltabs" style="display:flex;gap:4px"></span><label class="search"><input id="q" placeholder="검색어를 입력하세요." oninput="S.q=this.value;draw()"><i class="si"></i></label></div>
  <div class="total"><span>총 <em id="cnt">0</em>개의 차시가 있습니다.</span></div>
  <div class="grid" id="grid"></div>
</div>
<div class="foot"></div>
<div id="dim" class="dim" onclick="closeM()"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true"></div>
<script src="catalog.js"></script>
<script>
const AREAS=['듣기','말하기','읽기','쓰기'],GRADES=['초1~2','초3~4','초5~6'];
const LVTAG=['자모·낱말·인사','짧은 문장','관심사·수업 참여','학교생활 참여'];
const CHARS=['character_01','character_02','character_03','character_04','character_05','character_06'];
const svg=(p,w=20,sw=2)=>`<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON_SEARCH=svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',18);
const EXT=svg('<path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',15);
const EYE=svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',15);
const PLAY=svg('<path d="M8 5l11 7-11 7z" fill="currentColor"/>',24);
const CLOSE=svg('<path d="M6 6l12 12M18 6L6 18"/>',26);
document.querySelectorAll('.si').forEach(e=>e.outerHTML=ICON_SEARCH);
introIc.innerHTML=svg('<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',28);
const byId=Object.fromEntries(CATALOG.map(r=>[r.id,r]));
const S={g:'초1~2',a:'듣기',lv:0,q:''};
const pad=n=>String(n).padStart(2,'0');

/* 수업은 항상 새 창으로. 시안에 아직 없는 차시는 안내 페이지로 연다 */
function openLesson(id){const r=byId[id];window.open(r.st==='open'?r.file:'lessons/sample.html?id='+encodeURIComponent(id),'lesson-'+id)}
const fname=r=>r.file.split('/').pop().replace('.html','');
/* 목록 썸네일은 같은 틀로 통일, 모달에서는 실제 수업 첫 화면(있을 때) */
function thumb(r,shot=false){
  const inner=shot&&r.st==='open'?`<img class="shot" src="img/thumb_${fname(r)}.webp" alt="">`:`<div class="gen"><div class="bar"><i></i>학교생활 한국어 · ${r.a}</div><b>${r.t}</b><span class="no">${r.lv}수준 ${pad(r.n)}차시</span><img src="img/${CHARS[r.n%6]}.webp" alt=""></div>`;
  return `<div class="th" data-a="${r.a}" onclick="openLesson('${r.id}')">${inner}<span class="play"><span>${PLAY}</span></span></div>`}
function card(r){return `<div class="card" data-a="${r.a}">${thumb(r)}
  <div class="meta1"><span class="chip">${r.lv}수준</span><span class="chip a">${r.a}</span></div>
  <div class="ct" onclick="preview('${r.id}')">${pad(r.n)}. ${r.t}</div><div class="cm">${r.theme} · ${r.codes.split(',')[0].trim().replace(/-\d+$/,'')}</div>
  <div class="cbtn"><button onclick="preview('${r.id}')">${EYE}차시 정보</button><button class="go" onclick="openLesson('${r.id}')">${EXT}수업 열기</button></div></div>`}

function draw(){
  gtabs.innerHTML=GRADES.map(g=>`<button class="${S.g===g?'on':''}" onclick="S.g='${g}';draw()">${g} <small>(${g.slice(1).replace('~','·')}학년)</small></button>`).join('');
  atabs.innerHTML=AREAS.map(a=>`<button class="${S.a===a?'on':''}" onclick="S.a='${a}';draw()">${a}</button>`).join('');
  ltabs.innerHTML=['전체','1수준','2수준','3수준','4수준'].map((l,i)=>`<button class="${S.lv===i?'on':''}" onclick="S.lv=${i};draw()">${l}</button>`).join('');
  const q=S.q.trim();const rs=CATALOG.filter(r=>r.g===S.g&&r.a===S.a&&(!S.lv||r.lv===S.lv)&&(!q||(r.t+r.theme).includes(q)));
  cnt.textContent=rs.length;
  grid.innerHTML=[1,2,3,4].filter(lv=>rs.some(r=>r.lv===lv)).map(lv=>`<div class="lvhead">${lv}수준 <small>${LVTAG[lv-1]}</small></div>${rs.filter(r=>r.lv===lv).map(card).join('')}`).join('')||'<div class="lvhead">검색 결과가 없어요.</div>';
}

function preview(id){const r=byId[id];
  modal.innerHTML=`<div class="mHead"><div class="chips"><span class="chip">${r.g}</span><span class="chip">${r.lv}수준</span><span class="chip a" data-a="${r.a}">${r.a}</span><span class="chip a" data-a="${r.a}">${r.theme}</span></div><h2>${pad(r.n)}. ${r.t}</h2><div class="id">${r.id}</div><button class="x" onclick="closeM()" aria-label="닫기">${CLOSE}</button></div>
  <div class="mBody"><div>${thumb(r,true)}<div class="blk" style="margin-top:22px"><h4>학습 목표</h4><div class="goal">${r.goal}</div></div></div>
  <div><div class="blk"><h4>성취수준</h4><div class="std">${r.std}</div></div><div class="blk"><h4>연계 진단 문항</h4><div class="codes">${r.codes.split(',').map(c=>`<span>${c.trim()}</span>`).join('')}</div></div>
  <div class="blk"><h4>활동 구성</h4><ul class="acts">${r.acts.map((a,i)=>`<li><b>${i+1}</b>${a}</li>`).join('')}</ul></div></div></div>
  <div class="mFoot"><small>수업은 새 창으로 열리고, 이 목록은 그대로 남아 있어요.</small><button class="ibtn" onclick="closeM()">닫기</button><button class="ibtn f" onclick="openLesson('${r.id}')">${EXT}수업 열기 (새 창)</button></div>`;
  showM()}

const D={lv:{'듣기':1,'말하기':0,'읽기':0,'쓰기':0}};
function openDiag(){const g=S.g,LV=['미도달','1수준','2수준','3수준','4수준'];
  modal.innerHTML=`<div class="mHead"><div class="chips"><span class="chip">${g}</span></div><h2>진단 결과로 시작 차시 찾기</h2><div class="id">초기진단에서 도달한 수준을 고르면, 다음 수준의 첫 차시부터 보여 줘요.</div><button class="x" onclick="closeM()" aria-label="닫기">${CLOSE}</button></div>
  <div class="dgrid"><div><h4>① 영역별 진단 결과</h4>${AREAS.map(a=>`<div class="drow" data-a="${a}"><span class="an">${a}</span><div class="lvb">${LV.map((l,i)=>`<button class="${D.lv[a]===i?'on':''}" onclick="D.lv['${a}']=${i};openDiag()">${l}<small>${i===0?'1수준부터':i<4?`${i+1}수준부터`:'완료'}</small></button>`).join('')}</div></div>`).join('')}</div>
  <div><h4>② 이 순서로 수업하세요</h4>${AREAS.map(a=>{const lv=D.lv[a];if(lv>=4)return `<div class="path" data-a="${a}"><span class="an">${a}<small>4수준 도달</small></span><span style="color:var(--ink3);font-size:14px">모든 수준을 마쳤어요.</span></div>`;const rs=CATALOG.filter(r=>r.g===g&&r.a===a&&r.lv===lv+1).slice(0,4);return `<div class="path" data-a="${a}"><span class="an">${a}<small>${lv+1}수준 시작</small></span><div class="flow">${rs.map((r,i)=>(i?'<span class="ar">›</span>':'')+`<div class="step ${i?'':'first'}" onclick="openLesson('${r.id}')">${i?'':'<span class="s">여기서 시작</span><br>'}${pad(r.n)}. ${r.t}</div>`).join('')}</div></div>`}).join('')}</div></div>`;
  showM()}
function showM(){modal.classList.add('on');dim.classList.add('on')}
function closeM(){modal.classList.remove('on');dim.classList.remove('on')}
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
draw();
</script>
</body>
</html>
