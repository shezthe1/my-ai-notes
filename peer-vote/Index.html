<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 모바일 우선 한 화면 한 단계. 상단 뒤로·단계·진행바, 가운데 질문, 하단 고정 주 버튼 */
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --ink: #17181c;
  --muted: #5d6068;
  --line: #e3e3df;
  --line-strong: #c4c5c0;
  --press: #eeeeea;
  --accent: #2b4fd8;
  --accent-ink: #ffffff;
  --accent-text: #1e3ba8;
  --accent-weak: #e8edfc;
  --accent-soft: #f4f6fd;
  --accent-mid: #8ea2ea;
  --warn: #a8480f;
  --warn-soft: #fbe7d9;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121316; --surface: #1c1d21; --ink: #ededea; --muted: #a3a5ab; --line: #2e3036; --line-strong: #4a4d55; --press: #26272c;
    --accent: #7d98f5; --accent-ink: #0d1530; --accent-text: #a9bbfa; --accent-weak: #222c4d; --accent-soft: #1b2238; --accent-mid: #5670c9;
    --warn: #f0a070; --warn-soft: #3a2517;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.55; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
.app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; background: var(--bg); z-index: 10; padding-block: 8px 4px; display: grid; gap: 6px; }
.top-row { display: flex; align-items: center; gap: 6px; min-height: 44px; }
.step { flex: 1; font-size: 14px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
main { flex: 1; padding-block: 16px 24px; min-width: 0; }
.nav { position: sticky; bottom: 0; background: var(--bg); padding-block: 12px max(16px, env(safe-area-inset-bottom, 0px)); z-index: 10; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 버튼: 누르면 살짝 줄어든다 */
.btn {
  appearance: none; -webkit-appearance: none; width: 100%; height: 54px; border: 0; border-radius: 14px;
  background: var(--ink); color: var(--bg); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 160ms var(--ease-out), background-color 150ms ease, color 150ms ease;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { background: var(--line); color: var(--muted); cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.btn-label { transition: filter 200ms ease, opacity 200ms ease; }
.btn-label.busy { filter: blur(2px); opacity: 0.6; }
.icon-btn {
  appearance: none; -webkit-appearance: none; width: 44px; height: 44px; margin-left: -10px; border: 0; border-radius: 12px;
  background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: transform 160ms var(--ease-out), background-color 150ms ease;
}
.icon-btn:active { transform: scale(0.94); }

/* 진행바 */
.meter { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); transform-origin: left center; transform: scaleX(0); transition: transform 260ms var(--ease-out); }

/* 글자 */
.screen { display: grid; gap: 20px; align-content: start; }
.eyebrow { font-size: 13px; font-weight: 700; color: var(--accent-text); letter-spacing: 0.02em; }
.title { font-size: 32px; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.q-name { font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.lead, .q-text { font-size: 16px; line-height: 1.6; color: var(--muted); }
.intro-head { display: grid; gap: 12px; padding-top: 24px; }
.q-head { display: grid; gap: 6px; }
.help { font-size: 13px; line-height: 1.5; color: var(--muted); }
.muted { color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.steps li { display: flex; gap: 14px; align-items: flex-start; font-size: 15px; line-height: 1.6; }
.num {
  width: 24px; height: 24px; margin-top: 1px; border-radius: 999px; background: var(--ink); color: var(--bg);
  font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none;
}

/* 입력 */
.fields { display: grid; gap: 16px; }
.field { display: grid; gap: 8px; }
label { font-size: 14px; font-weight: 500; }
input[type="text"], input[type="password"], select, textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
  font: inherit; font-size: 16px; transition: border-color 150ms ease;
}
input[type="text"], input[type="password"] { height: 54px; padding: 0 16px; }
input.pin { letter-spacing: 0.4em; font-variant-numeric: tabular-nums; }
select { height: 48px; padding: 0 12px; }
textarea { min-height: 84px; padding: 12px 14px; resize: vertical; line-height: 1.55; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.8; letter-spacing: normal; }

/* 후보 */
.pick-area { display: grid; gap: 10px; }
.hint { font-size: 14px; line-height: 1.5; color: var(--muted); }
.cands { display: grid; gap: 8px; }
.cand {
  appearance: none; -webkit-appearance: none; width: 100%; min-height: 60px; padding: 0 14px 0 16px;
  border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink);
  font: inherit; font-size: 17px; font-weight: 700; text-align: left; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  transition: transform 160ms var(--ease-out), border-color 150ms ease, background-color 150ms ease;
}
.cand:active { transform: scale(0.98); }
.cand.is-1 { border-color: var(--accent); background: var(--accent-weak); }
.cand.is-2 { border-color: var(--accent-mid); background: var(--accent-soft); }
.slot { display: block; width: 26px; height: 26px; border-radius: 999px; border: 1.5px solid var(--line-strong); }
.badge { height: 28px; padding: 0 11px; border-radius: 999px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; }
.badge.b1 { background: var(--accent); color: var(--accent-ink); }
.badge.b2 { background: var(--surface); color: var(--accent-text); box-shadow: inset 0 0 0 1.5px var(--accent); }

/* 코멘트 */
.notes { display: grid; gap: 12px; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.add {
  appearance: none; -webkit-appearance: none; height: 48px; border: 1.5px dashed var(--line-strong); border-radius: 12px; background: transparent;
  color: var(--ink); font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 160ms var(--ease-out);
}
.add:active { transform: scale(0.98); }
.add .cnt { color: var(--muted); font-variant-numeric: tabular-nums; }

/* 확인 */
.rows { display: flex; flex-direction: column; }
.row {
  appearance: none; -webkit-appearance: none; width: 100%; min-height: 52px; padding: 8px 4px; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer;
  display: flex; align-items: center; gap: 12px; transition: background-color 150ms ease;
}
.row:active { background: var(--press); }
.row-num { width: 16px; font-size: 13px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.row-k { flex: 1; min-width: 0; font-size: 15px; font-weight: 500; }
.row-v { display: flex; gap: 10px; font-size: 14px; flex: none; }
.row-v .r1 { color: var(--accent-text); }
.row-v .r2 { color: var(--muted); }
.chev { flex: none; color: var(--muted); }

.notice { padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.notice.ok { background: var(--accent-weak); color: var(--ink); }

/* 완료 */
.done { display: grid; justify-items: center; text-align: center; gap: 8px; padding-top: 72px; }
.mark {
  width: 72px; height: 72px; margin-bottom: 16px; border-radius: 999px; background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center;
}
.mark path { stroke-dasharray: 30; stroke-dashoffset: 0; }
.done .small { margin-top: 12px; font-size: 13px; color: var(--muted); }

/* 결과 (팀장 전용) */
.result { display: grid; gap: 16px; }
.result h2 { font-size: 17px; margin: 0; }
.result p { font-size: 15px; }
.result .small { font-size: 14px; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 600px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; font-size: 13px; }
th:first-child, td:first-child { text-align: left; font-weight: 700; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; line-height: 1.3; }
.cell b { display: block; font-size: 15px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.profile { display: grid; gap: 6px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.profile:last-child { border-bottom: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; padding: 2px 10px; border-radius: 12px; background: var(--accent-weak); color: var(--ink); }
.quote { font-size: 14px; padding-left: 10px; border-left: 3px solid var(--line); }

@media (hover: hover) and (pointer: fine) {
  .cand:hover:not(.is-1):not(.is-2) { border-color: var(--line-strong); }
  .icon-btn:hover { background: var(--press); }
  .row:hover { background: var(--press); }
}
@media (prefers-reduced-motion: reduce) {
  .meter i { transition: none; }
  .btn:active:not(:disabled), .cand:active, .icon-btn:active, .add:active { transform: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="top-row">
      <button class="icon-btn" type="button" id="btn-back" aria-label="이전" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <span class="step" id="step-label"></span>
    </div>
    <div class="meter" id="meter" hidden><i id="bar"></i></div>
  </div>
  <main id="main"></main>
  <div class="nav" id="nav">
    <button class="btn" type="button" id="btn-next"><span class="btn-label" id="next-label">시작하기</span></button>
  </div>
</div>

<script>
const VIEW = <?!= jsonForScript_(view) ?>;
const CONFIG = <?!= jsonForScript_(config) ?>;
</script>
<script>
// ===== 설정 (Code.gs 에서 받음) =====
const PEOPLE = CONFIG.people;
const ELEMENTS = CONFIG.elements;
const TOTAL_VOTERS = CONFIG.totalVoters;
const MAX_COMMENTS = CONFIG.maxComments;
// 단계: 0 시작, 1~8 요소, 9 코멘트, 10 확인, 11 완료
const LAST_ELEM = ELEMENTS.length;
const S_COMMENT = LAST_ELEM + 1, S_REVIEW = LAST_ELEM + 2, S_DONE = LAST_ELEM + 3;

const state = { idx: 0, nick: "", pin: "", picks: {}, comments: [{ p: "", t: "" }, { p: "", t: "" }], sent: false, loaded: false, err: "", busy: false, returnTo: 0, ownerPw: "" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nameOf = (id) => (PEOPLE.find((p) => p.id === id) || { name: "" }).name;
const isPerson = (id) => PEOPLE.some((p) => p.id === id);
const CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>';

// google.script.run 을 Promise 로
function call(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

// ===== 움직임 =====
// 들어올 때만 움직이고 나갈 때는 바로 사라진다. Web Animations API 라 오래된 폰 브라우저에서도 동작한다.
const REDUCE = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
const EASE = "cubic-bezier(0.23, 1, 0.32, 1)";
const FROM = { fwd: "translateX(20px)", back: "translateX(-20px)", fade: "translateY(6px)" };
function enter(el, fromTransform, opts) {
  if (!el || !el.animate) return;
  const o = Object.assign({ duration: 220, easing: EASE, fill: "backwards", delay: 0 }, opts || {});
  if (REDUCE) { el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, easing: "ease", fill: "backwards" }); return; }
  el.animate([{ opacity: 0, transform: fromTransform }, { opacity: 1, transform: "none" }], o);
}
// iOS 사파리는 터치 리스너가 있어야 :active(누름 효과)를 보여준다
document.addEventListener("touchstart", function () {}, { passive: true });

// ===== 임시 저장 (이 기기에서만, 비밀번호는 저장하지 않음) =====
const DRAFT = "peerVoteDraft";
function saveDraft() { try { localStorage.setItem(DRAFT, JSON.stringify({ nick: state.nick, picks: state.picks, comments: state.comments })); } catch (e) {} }
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT) || "null");
    if (d && typeof d === "object") {
      if (typeof d.nick === "string") state.nick = d.nick;
      if (d.picks && typeof d.picks === "object") applyPicks(d.picks);
      if (Array.isArray(d.comments) && d.comments.length) applyComments(d.comments);
    }
  } catch (e) {}
}
function clearDraft() { try { localStorage.removeItem(DRAFT); } catch (e) {} }
function applyPicks(src) {
  state.picks = {};
  ELEMENTS.forEach((e) => {
    const a = src[e.id];
    if (Array.isArray(a)) state.picks[e.id] = a.filter(isPerson).filter((v, i, arr) => arr.indexOf(v) === i).slice(0, 2);
  });
}
function applyComments(src) {
  const list = src.slice(0, MAX_COMMENTS).map((c) => ({ p: c && isPerson(c.p) ? c.p : "", t: c && typeof c.t === "string" ? c.t : "" }));
  while (list.length < 2) list.push({ p: "", t: "" });
  state.comments = list;
}

// ===== 계산 =====
const sel = (eid) => state.picks[eid] || [];
function elemDone(eid) { return sel(eid).length === 2; }
function allDone() { return ELEMENTS.every((e) => elemDone(e.id)); }
function commentError() {
  return state.comments.some((c) => c.t.trim() && !c.p) ? "코멘트를 받을 사람을 선택해 주세요." : "";
}
function hintFor(n) {
  return n === 0 ? "먼저 누른 사람이 1순위예요. 본인은 빼고 골라 주세요."
    : n === 1 ? "이제 2순위를 골라 주세요."
    : "다시 누르면 취소돼요.";
}
const ERRORS = {
  nick: "닉네임을 1~" + CONFIG.maxNickLen + "자로 입력해 주세요.",
  pin: "비밀번호는 숫자 4자리로 입력해 주세요.",
  wrong_pin: "이미 사용 중인 닉네임이에요. 내 닉네임이 맞다면 비밀번호를 다시 확인해 주세요.",
  locked: "비밀번호를 여러 번 틀려 10분 동안 잠겼어요. 잠시 후 다시 시도해 주세요.",
  picks: "모든 요소에서 1순위와 2순위를 골라 주세요.",
  network: "연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.",
};

// ===== 화면 =====
function renderIntro() {
  return `<div class="screen">
    <div class="intro-head">
      <p class="eyebrow">팀 미션 · 익명 투표</p>
      <h1 class="title">동료 상호평가</h1>
      <p class="lead">각자의 미션 결과물을 떠올리며, 요소마다 가장 돋보인 동료를 골라 주세요.</p>
    </div>
    <ol class="steps">
      <li><span class="num">1</span><span>요소 8개마다 <b>1순위·2순위</b> 2명을 고릅니다.</span></li>
      <li><span class="num">2</span><span><b>본인은 고르지 마세요.</b></span></li>
      <li><span class="num">3</span><span>투표 내용은 익명으로 집계됩니다.</span></li>
    </ol>
    <div class="fields">
      <div class="field">
        <label for="nick">닉네임</label>
        <input type="text" id="nick" maxlength="${CONFIG.maxNickLen}" autocomplete="off" placeholder="아무 이름이나 괜찮아요" value="${esc(state.nick)}">
        <p class="help">제출 여부 확인용이에요. 결과 화면에서 투표 내용과 함께 보이지 않습니다.</p>
      </div>
      <div class="field">
        <label for="pin">비밀번호 (숫자 4자리)</label>
        <input type="password" class="pin" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="숫자 4자리" value="${esc(state.pin)}">
        <p class="help">처음이면 지금 정하는 번호예요. 응답을 고칠 때 같은 닉네임과 번호로 들어오세요.</p>
      </div>
    </div>
    <p class="notice" id="intro-err" ${state.err ? "" : "hidden"}>${esc(state.err)}</p>
  </div>`;
}

function renderElem(i) {
  const e = ELEMENTS[i - 1];
  return `<div class="screen">
    <div class="q-head">
      <p class="eyebrow">요소 ${i}</p>
      <h1 class="q-name">${esc(e.name)}</h1>
      <p class="q-text">${esc(e.q)}</p>
    </div>
    <div class="pick-area">
      <p class="hint" id="hint" aria-live="polite">${hintFor(sel(e.id).length)}</p>
      <div class="cands">${PEOPLE.map((p) =>
        `<button class="cand" type="button" data-p="${p.id}" aria-pressed="false"><span>${esc(p.name)}</span><span class="mark-slot" data-r=""></span></button>`
      ).join("")}</div>
    </div>
  </div>`;
}

// 선택이 바뀔 때는 버튼만 고친다. 바뀐 순위 표시만 새로 나타난다.
function updateCands(animate) {
  const i = state.idx;
  if (i < 1 || i > LAST_ELEM) return;
  const a = sel(ELEMENTS[i - 1].id);
  document.querySelectorAll(".cand").forEach((b) => {
    const at = a.indexOf(b.dataset.p);
    b.classList.toggle("is-1", at === 0);
    b.classList.toggle("is-2", at === 1);
    b.setAttribute("aria-pressed", at >= 0 ? "true" : "false");
    const slot = b.querySelector(".mark-slot");
    const r = at === 0 ? "1" : at === 1 ? "2" : "0";
    if (slot.dataset.r !== r) {
      slot.dataset.r = r;
      slot.innerHTML = r === "0" ? '<span class="slot" aria-hidden="true"></span>' : `<span class="badge b${r}">${r}순위</span>`;
      if (animate && r !== "0") enter(slot.firstElementChild, "scale(0.9)", { duration: 180 });
    }
  });
  const h = $("hint");
  if (h) h.textContent = hintFor(a.length);
}

function commentBlock(c, k) {
  return `<div class="card note">
    <div class="field"><label for="cp-${k}">코멘트 ${k + 1} · 받는 사람</label>
    <select id="cp-${k}" data-cp="${k}"><option value="">선택 안 함</option>${PEOPLE.map((p) => `<option value="${p.id}" ${c.p === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>
    <div class="field"><label for="ct-${k}">내용</label>
    <textarea id="ct-${k}" data-ct="${k}" maxlength="${CONFIG.maxCommentLen}" placeholder="좋았던 점, 다음에 기대하는 점">${esc(c.t)}</textarea></div>
  </div>`;
}
function renderComments() {
  const err = commentError();
  return `<div class="screen">
    <div class="q-head">
      <h1 class="q-name">남기고 싶은 말이 있나요?</h1>
      <p class="q-text">비워 둬도 제출할 수 있어요. 작성자 없이 팀장에게만 보입니다.</p>
    </div>
    <div class="notes" id="cblocks">${state.comments.map(commentBlock).join("")}</div>
    <button class="add" type="button" id="btn-add" ${state.comments.length >= MAX_COMMENTS ? "hidden" : ""}>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      <span>추가하기</span><span class="cnt" id="add-cnt">${state.comments.length} / ${MAX_COMMENTS}</span></button>
    <p class="notice" id="cerr" ${err ? "" : "hidden"}>${esc(err)}</p>
  </div>`;
}

function renderReview() {
  const cm = state.comments.filter((c) => c.p && c.t.trim()).length;
  return `<div class="screen">
    <div class="q-head">
      <h1 class="q-name">이대로 제출할까요?</h1>
      <p class="q-text">항목을 누르면 다시 고를 수 있어요.</p>
    </div>
    ${state.loaded ? '<p class="notice ok">이전에 제출한 응답을 불러왔어요. 고친 뒤 다시 제출하면 덮어씁니다.</p>' : ""}
    <div class="rows">${ELEMENTS.map((e, k) => {
      const a = sel(e.id);
      return `<button class="row" type="button" data-edit="${k + 1}" aria-label="${esc(e.name)} 다시 고르기">
        <span class="row-num">${k + 1}</span><span class="row-k">${esc(e.name)}</span>
        <span class="row-v"><span><b class="r1">1</b> ${esc(nameOf(a[0]) || "—")}</span><span><b class="r2">2</b> ${esc(nameOf(a[1]) || "—")}</span></span>${CHEV}</button>`;
    }).join("")}
      <button class="row" type="button" data-edit-notes aria-label="코멘트 고치기">
        <span class="row-num"></span><span class="row-k">코멘트</span><span class="row-v muted">${cm ? cm + "개" : "없음"}</span>${CHEV}</button>
    </div>
    <p class="notice" id="review-err" ${state.err ? "" : "hidden"}>${esc(state.err)}</p>
  </div>`;
}

function renderDone() {
  return `<div class="screen"><div class="done">
    <div class="mark" id="done-mark"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
    <h1 class="q-name">제출했어요</h1>
    <p class="q-text">${esc(state.nick.trim())}님, 참여해 주셔서 고마워요.</p>
    <p class="small">고치고 싶으면 같은 닉네임과 비밀번호로 다시 들어와 제출하세요. 이전 응답을 덮어씁니다.</p>
  </div></div>`;
}

function stepLabel(i) {
  return i === 0 ? "시작" : i <= LAST_ELEM ? `${i} / ${LAST_ELEM}` : i === S_COMMENT ? "코멘트 · 선택 사항" : i === S_REVIEW ? "마지막 단계" : "완료";
}

function render(dir) {
  const i = state.idx;
  const main = $("main");
  main.innerHTML = i === 0 ? renderIntro() : i <= LAST_ELEM ? renderElem(i) : i === S_COMMENT ? renderComments() : i === S_REVIEW ? renderReview() : renderDone();
  $("step-label").textContent = stepLabel(i);
  $("btn-back").hidden = i === 0 || i === S_DONE;
  const inQ = i >= 1 && i <= LAST_ELEM;
  $("meter").hidden = !inQ;
  if (inQ) $("bar").style.transform = `scaleX(${(i / LAST_ELEM).toFixed(3)})`;
  updateCands(false);
  updateNext();
  window.scrollTo(0, 0);

  if (!FROM[dir]) return;
  enter(main.firstElementChild, FROM[dir]);
  if (inQ) {
    // 후보는 40ms 간격으로 차례로. 누르는 데는 지장이 없다.
    main.querySelectorAll(".cand").forEach((b, k) => enter(b, "translateY(8px)", { duration: 260, delay: 60 + k * 40 }));
  }
  if (i === S_DONE) {
    enter($("done-mark"), "scale(0.9)", { duration: 260 });
    const path = main.querySelector("#done-mark path");
    if (path && path.animate && !REDUCE) path.animate([{ strokeDashoffset: 30 }, { strokeDashoffset: 0 }], { duration: 380, delay: 140, easing: EASE, fill: "backwards" });
  }
}

function updateNext() {
  const i = state.idx, next = $("btn-next"), label = $("next-label");
  let text = "다음", disabled = false, ghost = false;
  if (i === 0) { text = state.busy ? "확인 중" : "시작하기"; disabled = !(state.nick.trim() && /^\d{4}$/.test(state.pin)); }
  else if (i <= LAST_ELEM) {
    text = state.returnTo === S_REVIEW ? "확인으로 돌아가기" : i === LAST_ELEM ? "코멘트로" : "다음";
    disabled = !elemDone(ELEMENTS[i - 1].id);
  }
  else if (i === S_COMMENT) { disabled = !!commentError(); }
  else if (i === S_REVIEW) { text = state.busy ? "제출 중" : "제출하기"; disabled = !allDone(); }
  else { text = "응답 수정하기"; ghost = true; }
  label.textContent = text;
  label.classList.toggle("busy", state.busy);
  next.disabled = disabled;
  next.classList.toggle("ghost", ghost);
}

function showError(id, msg) {
  state.err = msg;
  const box = $(id);
  if (box) { box.textContent = msg; box.hidden = !msg; if (msg) enter(box, "translateY(4px)", { duration: 180 }); }
}

function go(n, dir) { state.idx = n; state.err = ""; render(dir); }

// ===== 이벤트 =====
$("main").addEventListener("click", (ev) => {
  const c = ev.target.closest(".cand");
  if (c) {
    const eid = ELEMENTS[state.idx - 1].id;
    const a = sel(eid).slice();
    const at = a.indexOf(c.dataset.p);
    if (at >= 0) a.splice(at, 1);
    else if (a.length < 2) a.push(c.dataset.p);
    else a[1] = c.dataset.p;
    state.picks[eid] = a;
    saveDraft(); updateCands(true); updateNext();
    return;
  }
  const ed = ev.target.closest("[data-edit]");
  if (ed) { state.returnTo = S_REVIEW; go(Number(ed.dataset.edit), "fade"); return; }
  if (ev.target.closest("[data-edit-notes]")) { go(S_COMMENT, "fade"); return; }
  if (ev.target.closest("#btn-add")) {
    if (state.comments.length >= MAX_COMMENTS) return;
    state.comments.push({ p: "", t: "" });
    const k = state.comments.length - 1;
    $("cblocks").insertAdjacentHTML("beforeend", commentBlock(state.comments[k], k));
    enter($("cblocks").lastElementChild, "translateY(8px)");
    $("add-cnt").textContent = `${state.comments.length} / ${MAX_COMMENTS}`;
    $("btn-add").hidden = state.comments.length >= MAX_COMMENTS;
    saveDraft();
  }
});
$("main").addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "nick") { state.nick = t.value; saveDraft(); updateNext(); }
  else if (t.id === "pin") {
    const v = t.value.replace(/\D/g, "").slice(0, 4);
    if (v !== t.value) t.value = v;
    state.pin = v; updateNext();
  }
  else if (t.dataset.ct !== undefined) { state.comments[Number(t.dataset.ct)].t = t.value; saveDraft(); refreshComments(); }
});
$("main").addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset.cp !== undefined) { state.comments[Number(t.dataset.cp)].p = t.value; saveDraft(); refreshComments(); }
});
$("main").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && state.idx === 0 && (ev.target.id === "nick" || ev.target.id === "pin")) { ev.preventDefault(); $("btn-next").click(); }
});
function refreshComments() {
  const err = commentError();
  const box = $("cerr");
  if (box) { box.hidden = !err; box.textContent = err; }
  updateNext();
}

$("btn-back").addEventListener("click", () => {
  const i = state.idx;
  if (i >= 1 && i <= LAST_ELEM && state.returnTo === S_REVIEW) { state.returnTo = 0; go(S_REVIEW, "back"); }
  else if (i === S_COMMENT) go(LAST_ELEM, "back");
  else if (i === S_REVIEW) go(S_COMMENT, "back");
  else if (i > 0) go(i - 1, "back");
});
$("btn-next").addEventListener("click", async () => {
  if (state.busy) return;
  const i = state.idx;
  if (i === 0) { await start(); return; }
  if (i <= LAST_ELEM) {
    if (!elemDone(ELEMENTS[i - 1].id)) return;
    if (state.returnTo === S_REVIEW) { state.returnTo = 0; go(S_REVIEW, "fade"); }
    else go(i + 1, "fwd");
    return;
  }
  if (i === S_COMMENT) { if (!commentError()) go(S_REVIEW, "fwd"); return; }
  if (i === S_REVIEW) { await submitVote(); return; }
  go(S_REVIEW, "back");
});

async function start() {
  if (!state.nick.trim() || !/^\d{4}$/.test(state.pin)) return;
  state.busy = true; updateNext(); showError("intro-err", "");
  try {
    const r = await call("login", state.nick, state.pin);
    state.busy = false;
    if (!r || !r.ok) { updateNext(); showError("intro-err", ERRORS[(r && r.error)] || ERRORS.network); return; }
    if (r.existing) {
      applyPicks(r.existing.picks || {});
      applyComments(r.existing.notes && r.existing.notes.length ? r.existing.notes : []);
      state.sent = true; state.loaded = true;
      saveDraft();
      go(S_REVIEW, "fwd");
    } else {
      state.loaded = false;
      go(1, "fwd");
    }
  } catch (e) {
    state.busy = false; updateNext(); showError("intro-err", ERRORS.network);
  }
}

async function submitVote() {
  if (!allDone()) return;
  state.busy = true; updateNext(); showError("review-err", "");
  const notes = state.comments.filter((c) => c.p && c.t.trim()).map((c) => ({ p: c.p, t: c.t.trim() }));
  try {
    const r = await call("submit", { nick: state.nick, pin: state.pin, picks: state.picks, notes: notes });
    state.busy = false;
    if (!r || !r.ok) { updateNext(); showError("review-err", ERRORS[(r && r.error)] || ERRORS.network); return; }
    state.sent = true; state.loaded = false; clearDraft();
    go(S_DONE, "fade");
  } catch (e) {
    state.busy = false; updateNext(); showError("review-err", ERRORS.network);
  }
}

// ===== 결과 (팀장 전용, ?view=result) =====
function renderOwnerGate(msg) {
  $("step-label").textContent = "결과 (팀장 전용)";
  $("nav").hidden = true; $("btn-back").hidden = true; $("meter").hidden = true;
  $("main").innerHTML = `<div class="screen">
    <div class="q-head"><h1 class="q-name">결과 보기</h1><p class="q-text">팀장 비밀번호를 입력하세요.</p></div>
    <form class="fields" id="owner-form">
      <div class="field"><label for="owner-pw">팀장 비밀번호</label><input type="password" id="owner-pw" autocomplete="current-password"></div>
      <button class="btn" type="submit" id="owner-go"><span class="btn-label" id="owner-label">결과 보기</span></button>
    </form>
    <p class="notice" id="owner-err" ${msg ? "" : "hidden"}>${esc(msg || "")}</p>
  </div>`;
  enter($("main").firstElementChild, FROM.fade);
  $("owner-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    loadResults($("owner-pw").value);
  });
}

async function loadResults(pw) {
  const label = $("owner-label");
  if (label) { label.textContent = "불러오는 중"; label.classList.add("busy"); }
  try {
    const r = await call("getResults", pw);
    if (!r || !r.ok) {
      const msg = r && r.error === "not_configured" ? "Code.gs 의 OWNER_PASSWORD 를 6자 이상으로 바꾼 뒤 새 버전으로 배포해 주세요."
        : r && r.error === "locked" ? ERRORS.locked : "비밀번호가 맞지 않아요.";
      renderOwnerGate(msg); return;
    }
    state.ownerPw = pw;
    renderResults(r);
  } catch (e) {
    renderOwnerGate(ERRORS.network);
  }
}

function renderResults(r) {
  const t = {};
  PEOPLE.forEach((p) => { t[p.id] = {}; ELEMENTS.forEach((e) => { t[p.id][e.id] = 0; }); });
  const notes = {}; PEOPLE.forEach((p) => { notes[p.id] = []; });
  r.votes.forEach((v) => {
    ELEMENTS.forEach((e) => {
      const a = (v.picks || {})[e.id];
      if (!Array.isArray(a)) return;
      if (a[0] && t[a[0]]) t[a[0]][e.id] += 2;
      if (a[1] && t[a[1]] && a[1] !== a[0]) t[a[1]][e.id] += 1;
    });
    (v.notes || []).forEach((n) => { if (n && notes[n.p] && n.t) notes[n.p].push(String(n.t)); });
  });
  const MAX = TOTAL_VOTERS * 2;
  $("main").innerHTML = `<div class="result">
    <div class="card"><h2>참여 현황</h2><p>제출 ${r.votes.length}명 / 전체 ${TOTAL_VOTERS}명</p>
      <p class="muted small">제출한 닉네임: ${r.nicks.length ? esc(r.nicks.join(", ")) : "없음"}</p>
      <p class="muted small">점수는 1순위 2점, 2순위 1점의 합이며 요소당 최대 ${MAX}점입니다. 본인 선택을 걸러낼 수 없으므로 2~3점 차이는 오차로 해석하세요.</p>
      <button class="btn ghost" type="button" id="btn-refresh">새로고침</button></div>
    <div class="card"><h2>요소별 점수</h2><div class="table-scroll"><table><thead><tr><th>이름</th>${ELEMENTS.map((e) => `<th>${esc(e.short)}</th>`).join("")}</tr></thead><tbody>` +
    PEOPLE.map((p) => `<tr><td>${esc(p.name)}</td>${ELEMENTS.map((e) => {
      const v = t[p.id][e.id];
      return `<td class="cell"><b>${v}</b><div class="bar"><i style="width:${Math.min(100, v / MAX * 100)}%"></i></div></td>`;
    }).join("")}</tr>`).join("") + `</tbody></table></div></div>
    <div class="card"><h2>개인별 강점 (점수 상위 3개)와 코멘트</h2>${PEOPLE.map((p) => {
      const top = ELEMENTS.map((e) => ({ e, v: t[p.id][e.id] })).sort((a, b) => b.v - a.v).slice(0, 3).filter((x) => x.v > 0);
      return `<div class="profile"><strong>${esc(p.name)}</strong><div class="tags">${top.length ? top.map((x) => `<span class="tag">${esc(x.e.name)} ${x.v}점</span>`).join("") : '<span class="muted small">아직 득점이 없습니다</span>'}</div>${notes[p.id].map((n) => `<p class="quote">${esc(n)}</p>`).join("")}</div>`;
    }).join("")}</div></div>`;
  $("btn-refresh").addEventListener("click", () => loadResults(state.ownerPw));
}

// ===== 시작 =====
if (VIEW === "result") {
  renderOwnerGate("");
} else {
  loadDraft();
  render("fade");
}
</script>
</body>
</html>
